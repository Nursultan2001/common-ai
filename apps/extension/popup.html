<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; font: 13px system-ui; margin: 0; padding: 14px; background: #0b0d12; color: #e8ebf0; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; margin: 8px 0 3px; color: #9aa3b2; }
      input { width: 100%; padding: 7px 8px; border-radius: 7px; border: 1px solid #2a3344; background: #151922; color: #e8ebf0; }
      button { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
      .primary { background: #5b8cff; color: #06122e; }
      .ghost { background: transparent; border: 1px solid #2a3344; color: #9aa3b2; }
      #status { margin-top: 10px; font-size: 12px; color: #9aa3b2; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>Common AI</h1>
    <label>Backend URL</label>
    <input id="backendUrl" placeholder="http://localhost:3000" />
    <label>Access token</label>
    <input id="token" type="password" placeholder="your token" />
    <label>Application ID</label>
    <input id="applicationId" placeholder="appl_..." />
    <button id="save" class="ghost">Save</button>
    <button id="check" class="ghost">Check unlock status</button>
    <button id="run" class="primary">Prepare autofill on this page</button>
    <button id="capture" class="ghost">Capture fields (build a map)</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
